name: Dependency audit

# Kept out of the CI workflow deliberately: a newly-published advisory against
# an unchanged dependency is not a reason to block an unrelated pull request.
# This surfaces the same information on a schedule instead, so it is visible
# without being in the way.
on:
  schedule:
    # Mondays at 06:17 UTC — an off-the-hour minute so the run isn't queued
    # behind everyone else's 06:00 cron.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical only. Low and moderate advisories are reported
      # in the step summary below but do not fail the run.
      - name: Audit (high and above)
        run: npm audit --audit-level=high

      - name: Full advisory report
        if: always()
        run: |
          echo '## npm audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
