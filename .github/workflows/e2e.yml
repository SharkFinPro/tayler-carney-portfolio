name: End-to-end

# The unit suite covers modules; this covers the app. It builds the real
# production bundle, serves it with `next start`, and drives it through a
# browser against a stubbed CMS — which is the only way to exercise `cms.ts`,
# the cache policy, the middleware's headers, and the rendered components
# together.
#
# Separate from `ci.yml` rather than a step inside it: this needs a browser
# download and a production build, so it is minutes where the unit job is
# seconds, and a slow required check discourages small PRs. It still runs on
# every PR — just in its own lane, in parallel.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; a stale end-to-end run tells you nothing.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only chromium. A portfolio site's end-to-end coverage is about whether
      # the app serves and renders at all, which does not differ across engines
      # enough to justify tripling the run.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # Two different things, and both are wanted on a failure. The html report
      # is the readable summary; `test-results/` holds the traces (captured on
      # retry) and the per-test error context. `if-no-files-found: ignore`
      # because a green run legitimately produces no `test-results/`.
      - name: Upload the report and any traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
